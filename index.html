<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f4ec">
<link rel="manifest" href="manifest.json">
<title>墨语 · 手写 AI 笔记</title>
<!-- 手写风格中文字体（霞鹜文楷），按需分片加载；加载失败会退回系统楷体 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f7f4ec;
    font-family: "LXGW WenKai", KaiTi, STKaiti, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #bar { position: fixed; left: 0; right: 0; top: 0; height: 48px; display: flex; align-items: center;
    gap: 6px; padding: 0 8px; background: #efe9dc; border-bottom: 1px solid #d9d0bd; box-sizing: border-box;
    overflow-x: auto; white-space: nowrap; z-index: 5; }
  #bar button, #bar select { font: inherit; font-size: 16px; height: 36px; padding: 0 12px; border: 1px solid #c9bda4; border-radius: 8px; background: #fffdf8; color: #333; flex: none; }
  #bar button.on { background: #2b2b2b; color: #fff; border-color: #2b2b2b; }
  #bar button.ask { background: #1f4fbf; color: #fff; border-color: #1f4fbf; }
  #bar select { max-width: 180px; }
  #bar .sep { width: 1px; height: 26px; background: #cfc5ae; flex: none; }
  #status { margin-left: auto; color: #7a6f5a; font-size: 14px; padding-left: 8px; flex: none; }
  #cv { position: fixed; left: 0; top: 48px; touch-action: none; display: block;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  #mask { position: fixed; inset: 0; left: 0; top: 0; right: 0; bottom: 0; background: rgba(0,0,0,.35);
    display: none; z-index: 10; align-items: center; justify-content: center; }
  #mask.show { display: flex; }
  #dlg { background: #fffdf8; border-radius: 12px; padding: 18px 20px; width: 92%; max-width: 520px;
    max-height: 88%; overflow-y: auto; box-sizing: border-box; -webkit-user-select: text; user-select: text; }
  #dlg h3 { margin: 0 0 12px; }
  #dlg label { display: block; margin: 10px 0 4px; font-size: 15px; color: #555; }
  #dlg input[type=text], #dlg input[type=password], #dlg input[type=number], #dlg textarea {
    width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
  #dlg textarea { height: 70px; }
  #dlg .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  #dlg .row label { margin: 0; }
  #dlg .tip { font-size: 13px; color: #888; margin-top: 4px; }
  #dlg .btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  #dlg .btns button { font: inherit; font-size: 16px; padding: 8px 18px; border-radius: 8px; border: 1px solid #bbb; background: #fff; }
  #dlg .btns button.primary { background: #1f4fbf; color: #fff; border-color: #1f4fbf; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: rgba(40,40,40,.92);
    color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 15px; display: none; z-index: 20; max-width: 90%; }
  #err { position: fixed; left: 0; right: 0; bottom: 0; background: #b00020; color: #fff; font: 13px monospace;
    padding: 8px; white-space: pre-wrap; display: none; z-index: 30; max-height: 40%; overflow: auto; }
</style>
<script>
  // 放在最前面、只用最老的语法：即使后面的代码在旧浏览器里报错，也能在屏幕上看到原因，而不是黑屏
  window.onerror = function (msg, src, line, col) {
    var el = document.getElementById('err');
    if (!el) { alert('出错: ' + msg + ' @' + line + ':' + col); return; }
    el.style.display = 'block';
    el.textContent += '出错: ' + msg + '  (行 ' + line + ':' + col + ')\n浏览器: ' + navigator.userAgent + '\n';
  };
</script>
</head>
<body>
<div id="bar">
  <select id="noteSel" title="切换笔记"></select>
  <button id="bNew">新建</button>
  <button id="bDel">删除</button>
  <span class="sep"></span>
  <button id="bPen" class="on">笔</button>
  <button id="bEraser">橡皮</button>
  <button id="bUndo">撤销</button>
  <button id="bClear">清页</button>
  <span class="sep"></span>
  <button id="bAsk" class="ask">问 AI</button>
  <button id="bSet">设置</button>
  <span id="status"></span>
</div>
<canvas id="cv"></canvas>

<div id="mask"><div id="dlg">
  <h3>设置</h3>
  <label>DeepSeek API Key</label>
  <input id="sKey" type="password" placeholder="sk-..." autocomplete="off">
  <div class="tip">在 platform.deepseek.com 申请。Key 只保存在本机浏览器里。</div>
  <label>接口地址（OpenAI 兼容）</label>
  <input id="sUrl" type="text">
  <label>模型名</label>
  <input id="sModel" type="text">
  <div class="tip">需要能看图的模型。DeepSeek 用 deepseek-flash。</div>
  <div class="row"><input id="sThink" type="checkbox"><label for="sThink">开启深度思考（更准但更慢）</label></div>
  <div class="row"><input id="sPenOnly" type="checkbox"><label for="sPenOnly">只用手写笔书写（手指用来上下滑动）</label></div>
  <div class="tip">第一次用手写笔时会自动勾选这一项，防止手掌误触画线。想用手指写字就取消勾选。</div>
  <div class="row"><input id="sPressure" type="checkbox"><label for="sPressure">笔迹粗细随笔压变化（第三方笔写着不顺可以关掉）</label></div>
  <div class="row"><input id="sDiary" type="checkbox"><label for="sDiary">日记本模式（哈利波特）：你的字渗进纸里消失，再用书法字从纸里浮现回信</label></div>
  <div class="row"><input id="sVanish" type="checkbox"><label for="sVanish">日记本模式下，再次落笔时旧回信淡去</label></div>
  <label>AI 回信字体</label>
  <select id="sFace" style="font:inherit;font-size:16px;padding:6px;width:100%"></select>
  <div class="tip">书法字体首次使用需要下载，稍等几秒。</div>
  <label>停笔几秒后自动问 AI（0 = 只用按钮）</label>
  <input id="sIdle" type="number" min="0" max="30" step="0.5">
  <label>AI 回复最多约多少字</label>
  <input id="sMax" type="number" min="20" max="1000" step="10">
  <label>AI 字号</label>
  <input id="sFont" type="number" min="14" max="48" step="1">
  <label>给 AI 的额外要求（可选，例如“你是我的英语老师，用英文回复并纠正我的错误”）</label>
  <textarea id="sPersona"></textarea>
  <div class="btns">
    <button id="sTest">测试连接</button>
    <button id="sCancel">取消</button>
    <button id="sSave" class="primary">保存</button>
  </div>
</div></div>
<div id="toast"></div>
<div id="err"></div>

<script>
(function () {
  'use strict';

  // ---------- 常量与状态 ----------
  var BAR_H = 48;
  var LINE_GAP = 48;          // 横线间距
  var FALLBACK_FONT = '"LXGW WenKai", KaiTi, STKaiti, "Kaiti SC", serif';
  var AI_FONT = FALLBACK_FONT;  // 界面用
  var STORE_NOTES = 'inkai.notes.v1';
  var STORE_SET = 'inkai.settings.v1';
  var STORE_CUR = 'inkai.current.v1';
  var FS_CDN = 'https://cdn.jsdelivr.net/npm/@fontsource/';
  var FACES = {
    mashanzheng: { label: '马善政 · 毛笔楷书（推荐）', family: 'Ma Shan Zheng', css: FS_CDN + 'ma-shan-zheng@5/400.css' },
    zhimangxing: { label: '志莽 · 行书（更像日记）', family: 'Zhi Mang Xing', css: FS_CDN + 'zhi-mang-xing@5/400.css' },
    longcang: { label: '龙藏 · 行楷', family: 'Long Cang', css: FS_CDN + 'long-cang@5/400.css' },
    liujianmaocao: { label: '刘建 · 毛草（草书，较难认）', family: 'Liu Jian Mao Cao', css: FS_CDN + 'liu-jian-mao-cao@5/400.css' },
    wenkai: { label: '霞鹜文楷 · 清秀手写', family: 'LXGW WenKai', css: null }
  };
  // 动画时长（毫秒）
  var SINK_MS = 1800, PAUSE_MS = 500, REVEAL_GAP = 75, REVEAL_CHAR = 650, VANISH_MS = 1400;

  var defaults = {
    key: '', url: 'https://api.deepseek.com', model: 'deepseek-flash', think: false,
    penOnly: false, idle: 2.5, maxChars: 150, fontSize: 28, persona: '',
    diary: true, vanish: true, face: 'mashanzheng', pressure: true
  };
  var settings = load(STORE_SET, {});
  for (var k in defaults) if (!(k in settings)) settings[k] = defaults[k];
  if (!FACES[settings.face]) settings.face = defaults.face;

  function inkColor() { return settings.diary ? '#1c140d' : '#1d1d1f'; }
  function aiColor() { return settings.diary ? '#2a1a0c' : '#1f4fbf'; }
  function faceFont(key) {
    var f = FACES[key] || FACES.wenkai;
    return '"' + f.family + '", ' + FALLBACK_FONT;
  }
  function ensureFace(key) {
    var f = FACES[key]; if (!f || !f.css || document.getElementById('face-' + key)) return;
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = f.css; l.id = 'face-' + key;
    document.head.appendChild(l);
  }
  var TRANSIENT = { b: 1, shown: 1, rv: 1, vanish: 1, sinking: 1 };
  function noTransient(k, v) { return TRANSIENT[k] && (k !== 'b' || (Array.isArray(v) && typeof v[0] === 'number')) ? undefined : v; }
  function now() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
  function ease(p) { p = p < 0 ? 0 : p > 1 ? 1 : p; return p * p * (3 - 2 * p); }
  var canFilter = 'filter' in document.createElement('canvas').getContext('2d');

  var notes = load(STORE_NOTES, null);
  var curId = load(STORE_CUR, null);
  if (!notes || typeof notes !== 'object' || !Object.keys(notes).length) { notes = {}; curId = newNote(); }
  if (!notes[curId]) curId = Object.keys(notes)[0];
  var note = notes[curId];
  note.strokes.forEach(calcBox);

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var W = 0, H = 0, scrollY = note.scrollY || 0;
  var tool = 'pen';
  var cur = null;             // 正在写的笔画
  var erasing = false;
  var touches = {};           // 触摸点，用于手指滚动
  var scrollMode = false, lastTouchY = 0;
  var undoStack = [];
  var idleTimer = null;
  var busy = false;
  var sinkGroups = [];        // 正在“渗入纸中”的笔迹组
  var rafOn = false;

  // ---------- 工具函数 ----------
  function load(key, def) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; }
  }
  var saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        note.scrollY = scrollY;
        localStorage.setItem(STORE_NOTES, JSON.stringify(notes, noTransient));
        localStorage.setItem(STORE_CUR, JSON.stringify(curId));
      } catch (e) { toast('保存失败：存储空间可能满了，请删除一些旧笔记'); }
    }, 400);
  }
  function saveSettings() { localStorage.setItem(STORE_SET, JSON.stringify(settings)); }
  function $(id) { return document.getElementById(id); }
  function toast(msg, ms) {
    var t = $('toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, ms || 3000);
  }
  function status(s) { $('status').textContent = s || ''; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function newNote() {
    var d = new Date(), id = 'n' + d.getTime();
    notes[id] = { id: id, title: '笔记 ' + (d.getMonth() + 1) + '-' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()),
      strokes: [], blocks: [], history: [], scrollY: 0, created: d.getTime() };
    return id;
  }
  function calcBox(s) {
    var p = s.p, x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
    for (var i = 0; i < p.length; i += 3) {
      var r = p[i + 2] / 2;
      if (p[i] - r < x1) x1 = p[i] - r; if (p[i] + r > x2) x2 = p[i] + r;
      if (p[i + 1] - r < y1) y1 = p[i + 1] - r; if (p[i + 1] + r > y2) y2 = p[i + 1] + r;
    }
    s.b = [x1, y1, x2, y2];
  }
  function blockBox(bl) {
    var lh = bl.fs * 1.5;
    return [bl.x, bl.y, bl.x + bl.w, bl.y + bl.lines.length * lh];
  }
  function contentBottom() {
    var m = 0;
    note.strokes.forEach(function (s) { if (s.b && s.b[3] > m) m = s.b[3]; });
    note.blocks.forEach(function (bl) { var b = blockBox(bl); if (b[3] > m) m = b[3]; });
    return m;
  }
  function pageHeight() { return Math.max(H * 2, contentBottom() + H); }
  function clampScroll() { scrollY = Math.max(0, Math.min(scrollY, pageHeight() - H)); }

  // ---------- 画布 ----------
  function resize() {
    W = window.innerWidth; H = window.innerHeight - BAR_H;
    dpr = window.devicePixelRatio || 1;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    clampScroll(); render();
  }

  function setView() { ctx.setTransform(dpr, 0, 0, dpr, 0, -scrollY * dpr); }

  // 有动画时用 requestAnimationFrame 持续重绘
  function kick() { if (!rafOn) { rafOn = true; requestAnimationFrame(function () { rafOn = false; render(); }); } }

  function paper() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (settings.diary) {
      // 旧羊皮纸：底色 + 四周微暗
      ctx.fillStyle = '#efe2c2'; ctx.fillRect(0, 0, cv.width, cv.height);
      var g = ctx.createRadialGradient(cv.width / 2, cv.height / 2, Math.min(cv.width, cv.height) * 0.3,
        cv.width / 2, cv.height / 2, Math.max(cv.width, cv.height) * 0.75);
      g.addColorStop(0, 'rgba(255,248,225,0.35)'); g.addColorStop(1, 'rgba(120,80,30,0.28)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);
      setView();
      return;
    }
    ctx.fillStyle = '#fffdf6'; ctx.fillRect(0, 0, cv.width, cv.height);
    setView();
    ctx.strokeStyle = '#e6dfcf'; ctx.lineWidth = 1;
    ctx.beginPath();
    var start = Math.floor(scrollY / LINE_GAP) * LINE_GAP + LINE_GAP;
    for (var y = start; y < scrollY + H; y += LINE_GAP) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
    ctx.stroke();
  }

  function render() {
    var t = now(), active = false;
    paper();
    var top = scrollY - 50, bot = scrollY + H + 50;
    // 笔画（正在渗入的不在这里画）
    note.strokes.forEach(function (s) { if (!s.sinking && (!s.b || (s.b[3] >= top && s.b[1] <= bot))) drawStroke(ctx, s); });
    // 渗入纸中的笔迹：变淡、晕开、略微扩散
    sinkGroups.forEach(function (gr) {
      if (gr.note !== note) return;
      var p = ease((t - gr.t0) / gr.dur);
      if ((t - gr.t0) < gr.dur) active = true;
      var e = gr.dir === 'out' ? p : 1 - p;   // e: 0=清晰 1=完全消失
      if (e >= 0.999) return;
      var L = gr.layer, s = 1 + e * 0.05;
      ctx.save();
      ctx.globalAlpha = Math.pow(1 - e, 1.4);
      if (canFilter) ctx.filter = 'blur(' + (e * 5).toFixed(2) + 'px) sepia(' + e.toFixed(2) + ')';
      var cx = L.x + L.w / 2, cy = L.y + L.h / 2;
      ctx.drawImage(L.cv, cx - L.w * s / 2, cy - L.h * s / 2, L.w * s, L.h * s);
      ctx.restore();
    });
    // AI 文字
    var vanished = false;
    note.blocks.forEach(function (bl) {
      var b = blockBox(bl);
      if (bl.rv != null || bl.vanish != null) active = true;
      if (bl.vanish != null && t - bl.vanish >= VANISH_MS) { bl.gone = true; vanished = true; return; }
      if (b[3] >= top && b[1] <= bot) drawBlock(ctx, bl, t);
    });
    if (vanished) { note.blocks = note.blocks.filter(function (bl) { return !bl.gone; }); save(); }
    // 普通模式下的“AI 正在看”提示
    if (busy && busy.box && !settings.diary) {
      var bb = busy.box;
      ctx.fillStyle = aiColor(); ctx.globalAlpha = 0.6;
      ctx.font = '20px ' + AI_FONT; ctx.textBaseline = 'top';
      ctx.fillText('· · ·', bb[0], bb[3] + 10);
      ctx.globalAlpha = 1;
    }
    if (active) kick();
  }

  // 把一组笔画画到离屏画布上，供“渗入”动画使用
  function makeLayer(list, box) {
    var m = 14, x = box[0] - m, y = box[1] - m, w = box[2] - box[0] + m * 2, h = box[3] - box[1] + m * 2;
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * dpr)); c.height = Math.max(1, Math.round(h * dpr));
    var g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, -x * dpr, -y * dpr);
    list.forEach(function (s) { drawStroke(g, s); });
    return { cv: c, x: x, y: y, w: w, h: h };
  }

  function drawStroke(c, s) {
    var p = s.p, col = s.c || inkColor();
    c.strokeStyle = col; c.fillStyle = col;
    c.lineCap = 'round'; c.lineJoin = 'round';
    var n = p.length / 3;
    if (n === 1) { c.beginPath(); c.arc(p[0], p[1], p[2] / 2, 0, Math.PI * 2); c.fill(); return; }
    for (var i = 1; i < n - 1; i++) curveSeg(c, p, i);
    tailSeg(c, p);
  }
  // 用相邻两点的中点做二次曲线，笔迹更圆滑（第 i 段：从上一个中点经过点 i 到下一个中点）
  function curveSeg(c, p, i) {
    var j = i * 3;
    var sx = i === 1 ? p[0] : (p[j - 3] + p[j]) / 2, sy = i === 1 ? p[1] : (p[j - 2] + p[j + 1]) / 2;
    c.lineWidth = p[j + 2];
    c.beginPath(); c.moveTo(sx, sy);
    c.quadraticCurveTo(p[j], p[j + 1], (p[j] + p[j + 3]) / 2, (p[j + 1] + p[j + 4]) / 2);
    c.stroke();
  }
  function tailSeg(c, p) {
    var n = p.length / 3, j = (n - 1) * 3;
    var sx = n === 2 ? p[0] : (p[j - 3] + p[j]) / 2, sy = n === 2 ? p[1] : (p[j - 2] + p[j + 1]) / 2;
    c.lineWidth = p[j + 2];
    c.beginPath(); c.moveTo(sx, sy); c.lineTo(p[j], p[j + 1]); c.stroke();
  }
  function chars(s) { return Array.from ? Array.from(s) : s.split(''); }

  function drawBlock(c, bl, t) {
    var lh = bl.fs * 1.5, i;
    c.save();
    c.fillStyle = aiColor(); c.textBaseline = 'top';
    c.font = bl.fs + 'px ' + faceFont(bl.face);
    if (bl.vanish != null) {
      // 淡去：像墨水被纸吸回去
      var v = ease((t - bl.vanish) / VANISH_MS);
      c.globalAlpha = 1 - v;
      if (canFilter) c.filter = 'blur(' + (v * 4).toFixed(2) + 'px)';
    }
    if (bl.rv == null) {
      for (i = 0; i < bl.lines.length; i++) c.fillText(bl.lines[i], bl.x, bl.y + i * lh + (lh - bl.fs) / 2);
      c.restore(); return;
    }
    // 浮现：一个字接一个字，从模糊的墨晕慢慢变清晰
    var k = 0, done = true;
    for (i = 0; i < bl.lines.length; i++) {
      var cs = chars(bl.lines[i]), x = bl.x, y = bl.y + i * lh + (lh - bl.fs) / 2;
      for (var j = 0; j < cs.length; j++, k++) {
        var q = (t - bl.rv - k * REVEAL_GAP) / REVEAL_CHAR, w = c.measureText(cs[j]).width;
        if (q < 1) done = false;
        if (q > 0) {
          if (q >= 1) { c.globalAlpha = 1; if (canFilter) c.filter = 'none'; c.fillText(cs[j], x, y); }
          else {
            var e = ease(q);
            if (canFilter) {
              c.filter = 'blur(' + ((1 - e) * 7).toFixed(2) + 'px)';
              c.globalAlpha = Math.min(1, e * 1.6) * 0.8;
              c.fillText(cs[j], x, y);           // 墨晕
              c.filter = 'none';
            }
            c.globalAlpha = e * e;
            c.fillText(cs[j], x, y);             // 逐渐清晰的字
          }
        }
        x += w;
      }
    }
    c.restore();
    if (done) { delete bl.rv; save(); }
  }

  // ---------- 输入 ----------
  function pt(e) {
    var r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top + scrollY };
  }

  // 把新写的内容裁剪成一张白底图片

  function systemPrompt() {
    var n = parseInt(settings.maxChars, 10) || 150;
    return [
      '你住在用户的手写笔记本里，是他的学习伙伴和老师。用户在纸上手写，你会收到他刚写下内容的图片（黑色笔迹，可能有涂改、公式或简单图形）。',
      '请：',

      '3. 回复会以手写字体显示在纸上：不要用 Markdown、井号、星号、表格或表情；需要分点时用“1. 2. 3.”并换行；公式用纯文本，例如 x^2 + 1 = 0。',
      '4. 回复尽量简洁，不超过约 ' + n + ' 字，除非用户明确要求详细。',

  function buildMessages(img) {

    hist.forEach(function (h) {

      msgs.push({ role: 'assistant', content: JSON.stringify({ read: h.r, reply: h.a, wait: false }) });
    });
    msgs.push({ role: 'user', content: [
      { type: 'text', text: '这是我刚在纸上写的内容，请辨认并回应（输出 json）。' },
      { type: 'image_url', image_url: { url: img } }

  }

  function callAI(messages) {
    var url = settings.url.replace(/\/+$/, '');

    var body = {
      model: settings.model,
      messages: messages,
      max_tokens: settings.think ? 4000 : 1500,
      stream: false,
      response_format: { type: 'json_object' },

  function parseReply(txt) {
    var s = String(txt).trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');

  function ask(manual) {

    if (!list.length) { if (manual) toast('先写点什么吧'); return; }
    if (!settings.key) { toast('请先在“设置”里填写 API Key'); openSettings(); return; }
    var box = unionBox(list);
    var img = snapshot(list, box);
    var noteRef = note;
    var diary = !!settings.diary;
    var group = null;
    if (diary) {
      // 字迹开始渗入纸中
      group = { note: noteRef, layer: makeLayer(list, box), t0: now(), dur: SINK_MS, dir: 'out' };
      list.forEach(function (s) { s.sinking = 1; });
      sinkGroups.push(group);

  function wrap(text, maxW, fs, font) {

  }

  function addReply(text, box, diary) {

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 300); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
  refreshNoteList();
  resize();
  // 加载用到的书法字体；字体下载好后重绘
  ensureFace(settings.face);
  Object.keys(notes).forEach(function (id) { notes[id].blocks.forEach(function (b) { if (b.face) ensureFace(b.face); }); });
  if (document.fonts) {
    if (document.fonts.ready) document.fonts.ready.then(render);
    if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', function () { render(); });
  }
  if (!window.PointerEvent) toast('这个浏览器太旧（不支持 Pointer Events），请安装新版 Chrome', 10000);
  if (!settings.key) setTimeout(openSettings, 300);

  // 供自动化测试使用
  window.__inkai = { ask: ask, settings: settings, getNote: function () { return note; }, render: render };
})();
</script>
